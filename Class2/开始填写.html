<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始填写</title>
</head>
<body>
     <main>
        <footer>
            <P>软件开发综合实践，课程演示案例</P>
        </footer> 
        <form action="#" method="get">
            <p>
                <lable for="name">姓名（可填昵称）</lable>
                <input type="text"id="name"name="name" placeholder="怎么称呼你"required></input>
            </p>
            <p>
                <lable for="email">邮箱</lable>
                <input type="email"id="mail"name="mail"required></input>
            </p>
            <p>课程评分</p>
            <p>
                <lable><input type="radio"name="score" value="5" checked>很好</lable>
                <lable><input type="radio"name="score" value="4" checked>好</lable>
                <lable><input type="radio"name="score" value="3" checked>一般</lable>
            </p>
            <p>想深入的主题（可多选）</p>
            <p>
                <lable><input type="checkbox"name="topic" value="layout">页面布局</lable>
                <lable><input type="checkbox"name="topic" value="js">JavaScript</lable>
                <lable><input type="checkbox"name="topic" value="chart">数据可视化</lable>
            </p>
            <p>
                <lable for="advice">具体建议</lable><br>
                <textarea id="advice" name="advice"rows="4" maxlength="200"placeholder="说点什么"></textarea>
            </p>
            <p>
                <button type="submit">提交反馈</button>
            </p>
        </form>>               

</body>
</html>
