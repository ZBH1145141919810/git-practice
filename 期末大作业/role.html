<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色浏览｜星穹铁道</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href=" ">星穹铁道展示中心</a >
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">首页</a ></li>
                <li class="nav-item"><a class="nav-link active" href="role.html">角色浏览</a ></li>
                <li class="nav-item"><a class="nav-link" href="chart.html">数据图表</a ></li>
                <li class="nav-item"><a class="nav-link" href="3d.html">3D星穹列车</a ></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>角色列表</h3>

    <div class="row my-4">
        <div class="col-md-6">
            <div class="input-group">
                <input id="filterInput" type="text" class="form-control" placeholder="输入命途筛选，例：巡猎">
                <button id="filterBtn" class="btn btn-outline-primary">筛选</button>
                <button id="resetBtn" class="btn btn-outline-secondary">重置</button>
            </div>
        </div>
    </div>
    <div id="tip" class="text-secondary mb-2">数据加载中……</div>
    <div id="roleContainer" class="row g-3"></div>
</div>


<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><b>命途：</b><span id="modalPath"></span></p >
                <p><b>属性：</b><span id="modalAttr"></span></p >
                <p><b>攻击力：</b><span id="modalAtk"></span></p >
                <p><b>生命值：</b><span id="modalHp"></span></p >
                <hr>
                <p><b>简介：</b><span id="modalDesc"></span></p >
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allData = [];
let myModal = new bootstrap.Modal(document.getElementById('detailModal'));


$(function(){
    $.getJSON("./data/role.json")
    .done(function(res){
        allData = res;
        $("#tip").text("数据加载完成");
        renderCard(allData);
    })
    .fail(function(){
        $("#tip").html("<span class='text-danger'>数据读取失败！请使用Live Server运行项目！</span>");
    });

 
    $("#filterBtn").click(function(){
        let kw = $("#filterInput").val().trim();
        if(!kw){
            $("#tip").text("筛选条件不能为空！");
            return;
        }
        let filter = allData.filter(item=> item.path.indexOf(kw)!==-1);
        renderCard(filter);
    })
 
    $("#resetBtn").click(function(){
        $("#filterInput").val("");
        renderCard(allData);
    })
})

function renderCard(arr){
    $("#roleContainer").empty();
    if(arr.length===0){
        $("#roleContainer").html("<div class='col-12'><p class='text-warning'>暂无匹配角色数据</p ></div>");
        return;
    }
    $.each(arr,function(idx,obj){
        let html=`
        <div class="col-md-3 col-sm-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">${obj.name}</h5>
                    <p class="card-text">命途：${obj.path}</p >
                    <p class="card-text">属性：${obj.attr}</p >
                    <button class="btn btn-sm btn-info showDetail" data-index="${idx}">查看详情</button>
                </div>
            </div>
        </div>`;
        $("#roleContainer").append(html);
    })

    $(".showDetail").click(function(){
        let i = $(this).data("index");
        let d = arr[i];
        $("#modalTitle").text(d.name);
        $("#modalPath").text(d.path);
        $("#modalAttr").text(d.attr);
        $("#modalAtk").text(d.atk);
        $("#modalHp").text(d.hp);
        $("#modalDesc").text(d.desc);
        myModal.show();
    })
}
</script>
</body>
</html>
