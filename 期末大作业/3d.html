<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D星穹列车｜星穹铁道</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        a-scene{height:85vh;}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href=" ">星穹铁道展示中心</a >
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">首页</a ></li>
                <li class="nav-item"><a class="nav-link" href="role.html">角色浏览</a ></li>
                <li class="nav-item"><a class="nav-link" href="chart.html">数据图表</a ></li>
                <li class="nav-item"><a class="nav-link active" href="3d.html">3D星穹列车</a ></li>
            </ul>
        </div>
    </div>
</nav>

<a-scene background="color:#0a0a28">
    <a-plane position="0 -2.5 0" rotation="-90 0 0" width="30" height="30" color="#141436"></a-plane>
    <a-box position="0 -1 0" width="6" height="1.2" depth="2" color="#cccccc"></a-box>
    <a-box position="0 0.3 0" width="5.2" height="1.0" depth="1.6" color="#4477bb"></a-box>
    <a-cylinder position="-2.2 -1.8 0.8" radius="0.4" height="0.2" color="#222222" rotation="90 0 0"></a-cylinder>
    <a-cylinder position="-2.2 -1.8 -0.8" radius="0.4" height="0.2" color="#222222" rotation="90 0 0"></a-cylinder>
    <a-cylinder position="2.2 -1.8 0.8" radius="0.4" height="0.2" color="#222222" rotation="90 0 0"></a-cylinder>
    <a-cylinder position="2.2 -1.8 -0.8" radius="0.4" height="0.2" color="#222222" rotation="90 0 0"></a-cylinder>
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="point" position="5 5 5" intensity="1.2"></a-light>
    <a-camera position="0 3 8"></a-camera>
</a-scene>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
