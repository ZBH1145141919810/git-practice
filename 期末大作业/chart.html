<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据图表｜星穹铁道</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        #pieChart,#barChart{height:400px;margin-bottom:30px;}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href=" ">星穹铁道展示中心</a >
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">首页</a ></li>
                <li class="nav-item"><a class="nav-link" href="role.html">角色浏览</a ></li>
                <li class="nav-item"><a class="nav-link active" href="chart.html">数据图表</a ></li>
                <li class="nav-item"><a class="nav-link" href="3d.html">3D星穹列车</a ></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>游戏角色数据统计</h3>
    <div class="mt-4">
        <h5>角色命途分布饼图</h5>
        <div id="pieChart"></div>

        <h5>各属性角色平均攻击力柱状图</h5>
        <div id="barChart"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(function(){
    $.getJSON("./data/role.json").done(function(data){
        let pathCount = {};
        data.forEach(d=>{
            if(pathCount[d.path]) pathCount[d.path]++;
            else pathCount[d.path]=1;
        })
        let pieData = Object.keys(pathCount).map(k=>{return {name:k,value:pathCount[k]};})
        let pieIns = echarts.init(document.getElementById("pieChart"));
        pieIns.setOption({
            tooltip:{trigger:"item"},
            series:[{type:"pie",radius:"60%",data:pieData}]
        })

        let group = {};
        data.forEach(d=>{
            if(!group[d.attr]) group[d.attr]={sum:0,count:0};
            group[d.attr].sum += d.atk;
            group[d.attr].count +=1;
        })
        let barX = Object.keys(group);
        let barY = barX.map(k=> Math.round(group[k].sum/group[k].count));
        let barIns = echarts.init(document.getElementById("barChart"));
        barIns.setOption({
            tooltip:{trigger:"axis"},
            xAxis:{type:"category",data:barX},
            yAxis:{type:"value",name:"平均攻击力"},
            series:[{type:"bar",data:barY}]
        })

        window.addEventListener('resize',()=>{pieIns.resize();barIns.resize()})
    })
})
</script>
</body>
</html>
