<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书收藏管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2 class="mb-4">图书收藏管理</h2>

    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="输入书名搜索图书">
    </div>
    <div class="card p-4 mb-4">
        <h5 id="formTitle">新增图书</h5>
        <input type="hidden" id="editId">
        <div class="mb-2">
            <label>书名</label>
            <input type="text" id="bookName" class="form-control">
        </div>
        <div class="mb-2">
            <label>作者</label>
            <input type="text" id="bookAuthor" class="form-control">
        </div>
        <div class="mb-2">
            <label>评分(0-10)</label>
            <input type="number" id="bookScore" class="form-control" min="0" max="10">
        </div>
        <div class="text-danger mb-2" id="errTip"></div>
        <button class="btn btn-primary" id="submitBtn">提交</button>
    </div>
    <div id="bookList"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
